<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PS5LM's icon: the name as a terminal line, in the site's palette and type
       (ps5lm.cobanov.dev: bg #0e0e14, ink #f2f2f7, accent #8288f0, Recursive Mono).
       Fonts: "PS5LM Mono" is site/assets/fonts/recursive-mono-v1 at weight 800. -->
  <defs>
    <radialGradient id="glow" cx="88%" cy="96%" r="80%">
      <stop offset="0" stop-color="#8288f0" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#8288f0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8288f0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#0e0e14"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <text x="58" y="104" font-family="PS5LM Mono" font-weight="400" font-size="34" fill="#ebebf5" fill-opacity="0.55">llama.cpp</text>
  <text x="50" y="300" font-family="PS5LM Mono" font-weight="800" font-size="172" fill="#f2f2f7" letter-spacing="-4">PS5</text>
